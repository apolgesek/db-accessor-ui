name: Deploy to Dev

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  STAGE: dev
  AWS_REGION: eu-central-1
  APP_DEPLOY_ROLE_TO_ASSUME_ARN: ${{ vars.APP_DEPLOY_ROLE_TO_ASSUME_ARN }}

jobs:
  changes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - 'public/**'
              - 'angular.json'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'eslint.config.js'

  plan-tag:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.next.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next tag
        id: next
        shell: bash
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail

          bump=patch
          if echo "$PR_LABELS_JSON" | jq -e '.[] | select(.name=="semver:major")' >/dev/null; then
            bump=major
          elif echo "$PR_LABELS_JSON" | jq -e '.[] | select(.name=="semver:minor")' >/dev/null; then
            bump=minor
          fi

          git fetch --tags --force
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')"
          VER="${LAST_TAG#v}"
          IFS='.' read -r MA MI PA <<< "${VER}"

          re='^[0-9]+$'
          [[ "$MA" =~ $re ]] || MA=0
          [[ "$MI" =~ $re ]] || MI=0
          [[ "$PA" =~ $re ]] || PA=0

          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac

          echo "new_tag=v${MA}.${MI}.${PA}" >> "$GITHUB_OUTPUT"

  tag-release:
    needs: [changes, plan-tag]
    if: needs.changes.outputs.app == 'true' && needs.plan-tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ needs.plan-tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Create release tag
        shell: bash
        env:
          NEW_TAG: ${{ needs.plan-tag.outputs.new_tag }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "<>"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "Tag ${NEW_TAG} already exists; skipping push."
            exit 0
          fi

          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="$(git rev-parse HEAD)"
          fi

          git tag -a "${NEW_TAG}" "${TARGET_SHA}" -m "release: ${NEW_TAG}"
          git push origin "${NEW_TAG}"

  build-deploy:
    needs: tag-release
    if: needs.tag-release.outputs.new_tag != ''
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      dist_dir: ${{ steps.dist.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-release.outputs.new_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build --configuration production

      - name: Resolve dist path
        id: dist
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d dist ]; then
            echo "dist/ not found"
            exit 1
          fi

          SUB="$(find dist -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
          if [ -n "$SUB" ] && [ -d "$SUB/browser" ]; then
            DIR="$SUB/browser"
          elif [ -n "$SUB" ]; then
            DIR="$SUB"
          else
            DIR="dist"
          fi

          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
          echo "Using dist dir: ${DIR}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.APP_DEPLOY_ROLE_TO_ASSUME_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deployment config
        id: config
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="$(aws ssm get-parameter \
            --name "/db-accessor-infra-${STAGE}/static-site/bucket-name" \
            --query "Parameter.Value" \
            --output text)"

          DISTRIBUTION_ID="$(aws ssm get-parameter \
            --name "/db-accessor-infra-${STAGE}/cloudfront/distribution-id" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || true)"

          AUTHORITY="$(aws ssm get-parameter \
            --name "/db-accessor-${STAGE}/auth/authority" \
            --query "Parameter.Value" \
            --output text)"

          CLIENT_ID="$(aws ssm get-parameter \
            --name "/db-accessor-${STAGE}/auth/client-id" \
            --query "Parameter.Value" \
            --output text)"

          IDENTITY_PROVIDER_NAME="$(aws ssm get-parameter \
            --name "/db-accessor-${STAGE}/auth/identity-provider-name" \
            --query "Parameter.Value" \
            --output text)"

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${DISTRIBUTION_ID}" >> "$GITHUB_OUTPUT"
          echo "authority=${AUTHORITY}" >> "$GITHUB_OUTPUT"
          echo "client_id=${CLIENT_ID}" >> "$GITHUB_OUTPUT"
          echo "identity_provider_name=${IDENTITY_PROVIDER_NAME}" >> "$GITHUB_OUTPUT"

      - name: Write runtime config
        shell: bash
        env:
          CFG: ${{ steps.dist.outputs.dir }}/config.json
          NEW_TAG: ${{ needs.tag-release.outputs.new_tag }}
          AUTHORITY: ${{ steps.config.outputs.authority }}
          CLIENT_ID: ${{ steps.config.outputs.client_id }}
          IDENTITY_PROVIDER_NAME: ${{ steps.config.outputs.identity_provider_name }}
        run: |
          set -euo pipefail

          node -e "
            const fs = require('fs');
            const p = process.env.CFG;
            const config = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : {};
            config.version = process.env.NEW_TAG;
            config.auth = {
              ...(config.auth ?? {}),
              authority: process.env.AUTHORITY,
              clientId: process.env.CLIENT_ID,
              scope: config.auth?.scope ?? 'openid email profile',
              identityProviderName: process.env.IDENTITY_PROVIDER_NAME,
            };
            fs.writeFileSync(p, JSON.stringify(config, null, 2) + '\n');
          "

      - name: Upload immutable assets
        run: |
          aws s3 sync "${{ steps.dist.outputs.dir }}/" "s3://${{ steps.config.outputs.bucket }}/" \
            --delete \
            --exclude "index.html" \
            --exclude "config.json" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html
        run: |
          aws s3 cp "${{ steps.dist.outputs.dir }}/index.html" "s3://${{ steps.config.outputs.bucket }}/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Upload config.json
        run: |
          aws s3 cp "${{ steps.dist.outputs.dir }}/config.json" "s3://${{ steps.config.outputs.bucket }}/config.json" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "application/json; charset=utf-8"

      - name: Invalidate CloudFront
        if: steps.config.outputs.distribution_id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.config.outputs.distribution_id }}" \
            --paths "/*"

      - name: Upload build artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ steps.dist.outputs.dir }}

  github-release:
    needs: [tag-release, build-deploy]
    if: needs.tag-release.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - run: zip -r "dist-${{ needs.tag-release.outputs.new_tag }}.zip" dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.tag-release.outputs.new_tag }}
          name: ${{ needs.tag-release.outputs.new_tag }}
          files: dist-${{ needs.tag-release.outputs.new_tag }}.zip
