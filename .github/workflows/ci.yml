name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webiny/action-conventional-commits@v1.3.0
        with:
          allowed-commit-types: 'feat,fix,refactor,chore'

      - name: Set semver label from commits
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            let bump = 'none';
            for (const { commit } of commits) {
              const msg = commit.message;
              const firstLine = msg.split('\n')[0];
              if (/BREAKING CHANGE/i.test(msg) || /^(\w+)(\(.+\))?!:/.test(firstLine)) {
                bump = 'major';
                break;
              }
              if (bump === 'none' && /^feat(\(.+\))?:/.test(firstLine)) {
                bump = 'minor';
              }
              if (bump === 'none' && /^fix(\(.+\))?:/.test(firstLine)) {
                bump = 'patch';
              }
            }

            const semverLabels = ['semver:major', 'semver:minor', 'semver:patch'];
            const existing = pr.labels.map((label) => label.name);
            for (const label of semverLabels) {
              if (existing.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                }).catch((error) => core.info(`Could not remove ${label}: ${error.message}`));
              }
            }

            if (bump !== 'none') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [`semver:${bump}`],
              });
            }

  build:
    needs: validate-conventional-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx ng build --configuration production

  lint:
    needs: validate-conventional-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx ng lint
